<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>Sorteggio Mondiale</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />

    <!-- Icone (Material Symbols) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>WORLD CUP DRAW</h1>
        <p class="subtitle">Sorteggio giocatori e nazionali</p>
      </header>

      <main>
        <section class="main-actions">
          <button id="btnDraw" class="btn-draw">
            <span class="material-symbols-rounded">casino</span>
            <span>ESegui sorteggio</span>
          </button>

          <div class="quick-stats">
            <div class="stat-card">
              <span class="label">Partecipanti</span>
              <span class="value" id="c1">0</span>
            </div>
            <div class="stat-card">
              <span class="label">Nazionali</span>
              <span class="value" id="c2">0</span>
            </div>
          </div>
        </section>

        <section class="draw-layout">
          <!-- URNA GIOCATORI -->
          <div class="urn-section" id="urnPlayers">
            <div class="urn-label">
              <span>Giocatori</span>
              <span class="counter">
                <span class="material-symbols-rounded">person</span>
                <span id="c1b">0</span>
              </span>
            </div>

            <div class="urn-visual">
              <div class="urn-glass">
                <div class="balls-container" id="playersBalls"></div>
              </div>
            </div>

            <div class="result-box" id="playerResult">
              Premi “ESegui sorteggio”
            </div>

            <div class="list-container">
              <div class="list-title">Giocatori rimasti</div>
              <div id="playersList"></div>
            </div>
          </div>

          <!-- URNA NAZIONALI -->
          <div class="urn-section" id="urnNations">
            <div class="urn-label">
              <span>Nazionali</span>
              <span class="counter">
                <span class="material-symbols-rounded">flag</span>
                <span id="c2b">0</span>
              </span>
            </div>

            <div class="urn-visual">
              <div class="urn-glass">
                <div class="balls-container" id="nationsBalls"></div>
              </div>
            </div>

            <div class="result-box" id="nationResult">
              Premi “ESegui sorteggio”
            </div>

            <div class="list-container">
              <div class="list-title">Nazionali rimaste</div>
              <div id="nationsList"></div>
            </div>
          </div>
        </section>

        <!-- CRONOLOGIA -->
        <section class="history-section">
          <div class="history-header">
            <h2>Cronologia sorteggi</h2>
            <div class="history-actions">
              <button class="btn-wa" id="btnWa">
                <span class="material-symbols-rounded">share</span>
                Invia su WhatsApp
              </button>
              <button class="btn-reset" onclick="resetApp()">
                <span class="material-symbols-rounded">restart_alt</span>
                Reset
              </button>
            </div>
          </div>

          <div id="historyList" class="history-list"></div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
